name: Release

# The fork publishes a Windows build. The upstream macOS job requires signing
# secrets that are intentionally not inherited by forks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $v = python scripts/changelog.py version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo version $v" }
      - name: Prepare release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python scripts/changelog.py notes ("${{ github.ref_name }}" -replace '^v', '') --out dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        shell: cmd
        run: scripts\build.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            dist/mousetroke.exe
            dist/release-notes.md
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: dist
      - name: Create checksums and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" > latest.txt
          printf '%s\n' "$RELEASE_TAG" | cmp latest.txt -
          sha256sum mousetroke.exe latest.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" mousetroke.exe latest.txt SHA256SUMS.txt \
            --title "Mousetroke $RELEASE_TAG (yscjr fork)" \
            --notes-file release-notes.md
